[package]
name = "pgdumb"
version = "0.1.0"
description = "A minimal desktop GUI for running SQL queries and psql meta-commands against PostgreSQL"
authors = ["Inspired Beings"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pgdumb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["v4"] }
keyring = "=4.2.0"
tokio-postgres-rustls = { version = "=0.14.0", features = ["native-certs", "ring"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.1", features = ["sync", "rt", "macros"] }
tokio-postgres = "=0.7.18"
futures-util = "=0.3.34"
tauri-plugin-store = "=2.4.4"

[dev-dependencies]
tempfile = "=3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
